  if (!c) return `<div class="layout"><div class="main">${err}<p class="note">Classe introuvable.</p><button class="back" data-go="#/prof">${icon('back', 'sm')} Mes classes</button></div></div>`;
  const stu = (P.students || []).filter(s => s.class_id === c.id);
  const per = stu.map(s => ({ s, a: analyse(rowsFor([s.id])) }));
  // Notions de la classe : on additionne les compteurs de tous les élèves.
  const agg = {};
  for (const r of P.stats || []) { const k = `${r.level}|${r.category}`; const x = (agg[k] ||= { level: r.level, category: r.category, total: 0, correct: 0 }); x.total += r.total; x.correct += r.correct; }
  const all = analyse(Object.values(agg));
  const toRework = all.notions.filter(n => n.total >= 10 && n.rate < .7).sort((a, b) => a.rate - b.rate).slice(0, 8);
  const follow = per.filter(x => x.a.total >= 20 && x.a.rate < .5);
  return `<div class="layout"><div class="side">
      <button class="back" data-go="#/prof">${icon('back', 'sm')} Mes classes</button>
      <section class="drop" aria-labelledby="cl-t"><div class="num" aria-hidden="true">${LEVELS[c.level].num}<sup>e</sup></div>
        <h1 id="cl-t" style="--tw:${Math.max(7, c.name.length)}">${esc(c.name)}</h1>
        <p>Code à donner aux élèves :</p><p class="classcode">${c.code}</p>
        <p>${plural(stu.length, 'élève')} · ${plural(all.total, 'réponse')} · ${pct(all.rate)} de réussite</p>
      </section>
      <div class="sec"><h2>Compétences de la classe</h2></div>${compRows(all.competences)}
      <p class="note">Estimation à partir des automatismes travaillés : chaque notion est rattachée à l’une des six compétences du cycle 4.</p>
    </div><div class="main">${err}
      <div class="sec"><h2>À retravailler en classe</h2></div>
      ${toRework.length ? `<div class="notions">${toRework.map(notionRow).join('')}</div>` : '<p class="note">Pas encore assez de réponses : une notion apparaît ici avec au moins 10 réponses de la classe et moins de 70 % de réussite.</p>'}
      ${follow.length ? `<div class="sec"><h2>Élèves à accompagner</h2></div><p class="note" style="margin-top:0">${follow.map(x => esc(x.s.name)).join(', ')} : moins de 50 % de réussite sur au moins 20 réponses.</p>` : ''}
      ${P.v2 ? workHTML(c, stu, toRework) : '<p class="msg" style="margin-top:24px">Pour les devoirs, les groupes de besoins et les aménagements, exécutez une fois le fichier supabase/migration-002.sql dans Supabase (SQL Editor), puis rechargez cette page.</p>'}
      <div class="sec"><h2>Élèves</h2>${P.v2 && stu.length ? '<button class="link" data-act="auto-groups">Répartir en groupes de besoins</button>' : '<span class="muted" style="font-size:13px">réussite · dernière activité</span>'}</div>
      ${stu.length ? `<div class="rows">${per.map(({ s, a }) => `<button class="row" data-go="#/prof/${c.id}/${s.id}"><div><div class="n">${esc(s.name)}${s.grp ? ` <span class="chip">${esc(s.grp)}</span>` : ''}${s.adapt && Object.values(s.adapt).some(Boolean) ? ' <span class="chip">aménagé</span>' : ''}</div>
          <div class="s">${a.total ? `${plural(a.total, 'réponse')} · ${pct(a.rate)}` : 'pas encore de réponse'} · ${since(s.last_seen)}${a.weak.length ? ` · à travailler : ${esc(a.weak.slice(0, 2).map(w => w.category).join(', '))}` : ''}</div></div>${icon('next')}</button>`).join('')}</div>`
        : '<p class="note">Aucun élève inscrit. Projetez le code ci-contre : chaque élève l’entre dans Progrès → Rejoindre ma classe, avec son prénom et un code secret à 4 chiffres.</p>'}
      <div class="note"><button class="danger" data-act="class-del">Supprimer la classe et ses résultats</button></div>
    </div></div>`;
}

function profStudentView(err) {
  const s = (P.students || []).find(x => x.id === route.stu);
  const c = s && (P.classes || []).find(x => x.id === s.class_id);
  if (!s || !c) return `<div class="layout"><div class="main">${err}<p class="note">Élève introuvable.</p><button class="back" data-go="#/prof">${icon('back', 'sm')} Mes classes</button></div></div>`;
  const a = analyse(rowsFor([s.id]));
  const ses = P.sessions || [];
  return `<div class="layout"><div class="side">
      <button class="back" data-go="#/prof/${c.id}">${icon('back', 'sm')} ${esc(c.name)}</button>
      <section class="drop slim" aria-labelledby="st-t"><h1 id="st-t" style="--tw:${Math.max(7, s.name.length)}">${esc(s.name)}</h1>
        <p>${a.total ? `${plural(a.total, 'réponse')}, ${pct(a.rate)} de réussite.` : 'Pas encore de réponse.'} Dernière activité : ${since(s.last_seen)}.</p></section>
      <div class="sec"><h2>Compétences</h2></div>${compRows(a.competences)}
      ${P.v2 ? studentAdaptHTML(s) : ''}
      <div class="bottom-actions"><button class="btn line block" data-act="stu-pin">Donner un nouveau code secret</button><button class="danger" data-act="stu-del">Retirer l’élève de la classe</button></div>
    </div><div class="main">${err}
      <div class="sec"><h2>Points forts</h2></div>
      ${a.strong.length ? `<div class="notions">${a.strong.map(notionRow).join('')}</div>` : '<p class="note">Une notion apparaît ici à partir de 5 réponses et 80 % de réussite.</p>'}
      <div class="sec"><h2>Points faibles</h2></div>
      ${a.weak.length ? `<div class="notions">${a.weak.map(notionRow).join('')}</div>` : '<p class="note">Aucun pour l’instant (moins de 60 % après au moins 3 réponses).</p>'}
      <div class="sec"><h2>Dernières séries</h2></div>
      ${ses.length ? `<table class="ledger"><thead><tr><th>Date</th><th>Série</th><th>Score</th></tr></thead><tbody>${ses.map(x => `<tr><td>${new Date(x.played_at).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })}</td><td class="q">${esc(x.chapter)} · ${x.mode === 'exam' ? 'examen' : 'entraînement'}</td><td>${x.score}/${x.total}</td></tr>`).join('')}</tbody></table>` : '<p class="note">Aucune série enregistrée.</p>'}
      <div class="sec"><h2>Toutes les notions</h2></div>
      ${a.notions.length ? `<div class="notions">${[...a.notions].sort((x, y) => x.rate - y.rate).map(notionRow).join('')}</div>` : ''}
    </div></div>`;
}

const GROUPS = ['Consolider', 'Progresser', 'Approfondir'];
function workHTML(c, stu, toRework) {
  const chs = DATA.chapters[c.level] || [];
  const groups = [...new Set(stu.map(x => x.grp).filter(Boolean))];
  const list = (P.assign || []).map(a => {
    const target = stu.filter(x => !a.grp || x.grp === a.grp);
    const res = (P.results || []).filter(r => r.assignment_id === a.id && target.some(x => x.id === r.student_id));
    const avg = res.length ? res.reduce((m, r) => m + r.score / Math.max(1, r.total), 0) / res.length : null;
    const missing = target.filter(x => !res.some(r => r.student_id === x.id)).map(x => x.name);
    return `<article class="work"><div><b>${esc(a.title)}</b>
      <small>${a.grp ? 'Groupe ' + esc(a.grp) : 'Toute la classe'} · ${plural(a.n, 'question')}${a.due ? ' · pour le ' + new Date(a.due + 'T12:00').toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) : ''}</small>
      <small>${res.length}/${target.length} fait${res.length > 1 ? 's' : ''}${avg == null ? '' : ' · ' + pct(avg) + ' de réussite'}${missing.length && missing.length <= 8 ? ' · pas encore : ' + esc(missing.join(', ')) : ''}</small></div>
      <button class="icon-btn" data-act="work-del" data-id="${a.id}" aria-label="Supprimer le devoir ${esc(a.title)}">${icon('close')}</button></article>`;
  }).join('');
  const dflt = new Date(Date.now() + 7 * 864e5).toISOString().slice(0, 10);
  return `<div class="sec"><h2>Devoirs</h2></div>
    ${list ? `<div class="works">${list}</div>` : '<p class="note" style="margin-top:0">Aucun devoir. Chaque élève reçoit les questions à son propre palier : un même devoir s’adapte à toute la classe.</p>'}
    <form class="form classcard" id="work-form" novalidate style="margin-top:16px">
      <h2 class="cond">Donner un devoir</h2>
      <div class="field"><label for="w-src">Contenu</label><select class="select" id="w-src" name="src">
        ${toRework.length ? `<option value="rework">Notions à retravailler en classe (${toRework.length})</option>` : ''}
        ${chs.map(ch => `<option value="ch:${ch.id}">${esc(ch.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="w-title">Titre (facultatif)</label><input class="input" id="w-title" name="title" maxlength="60" placeholder="Par défaut : le nom du chapitre"></div>
      <div class="field"><label for="w-grp">Pour</label><select class="select" id="w-grp" name="grp"><option value="">Toute la classe</option>${[...new Set([...GROUPS.filter(g => groups.includes(g)), ...groups])].map(g => `<option value="${esc(g)}">Groupe ${esc(g)}</option>`).join('')}</select></div>
      <div class="field"><label for="w-n">Nombre de questions</label><select class="select" id="w-n" name="n"><option>10</option><option>15</option><option>20</option></select></div>
      <div class="field"><label for="w-due">À faire pour le</label><input class="input" id="w-due" name="due" type="date" value="${dflt}"></div>
      <button class="btn ink block" type="submit">Donner le devoir</button>
    </form>`;
}
function studentAdaptHTML(st) {
  const a = st.adapt || {};
  const row = (key, label, help, on) => `<div class="setting"><div><b id="ad-${key}">${label}</b><small>${help}</small></div><button class="switch" role="switch" aria-checked="${!!on}" aria-labelledby="ad-${key}" data-adapt="${key}"><i></i></button></div>`;
  return `<div class="sec"><h2>Groupe de besoins</h2></div>
    <div class="seg grp" role="group" aria-label="Groupe de besoins">${['', ...GROUPS].map(g => `<button data-grp-set="${g}" aria-pressed="${(st.grp || '') === g}">${g || 'Aucun'}</button>`).join('')}</div>
    <div class="sec"><h2>Aménagements</h2></div>
    <div class="settings">
      ${row('dys', 'Police adaptée', 'Pour les élèves dys.', a.dys)}
      ${row('tts', 'Lecture à voix haute', 'Bouton « Écouter » sur chaque question.', a.tts)}
      ${row('size', 'Grandes questions', 'Texte agrandi pendant les séries.', a.size > 1)}
      ${row('t133', 'Tiers-temps', 'Chronos multipliés par 4/3.', a.time > 1)}
      ${row('t0', 'Sans chrono', 'Aucun chronomètre.', a.time === 0)}
    </div>
    <p class="note" style="margin:8px 0 0">Ces aménagements s’appliquent sur l’appareil de l’élève à sa prochaine ouverture de MathQuest ; il ne peut pas les retirer.</p>`;
}
async function patchStudent(id, body) {
  await api(`/rest/v1/students?id=eq.${id}`, { method: 'PATCH', body, prefer: 'return=minimal' });
  const st = P.students.find(x => x.id === id); if (st) Object.assign(st, body);
}

/* ---------- Événements ---------- */
const AUTH_ERRORS = {
  invalid_credentials: 'E-mail ou mot de passe incorrect.',
  email_not_confirmed: 'Confirmez d’abord votre adresse : cliquez sur le lien reçu par e-mail.',
  user_already_exists: 'Un compte existe déjà avec cette adresse : connectez-vous.',
  weak_password: 'Mot de passe trop faible : 8 caractères au moins.',
  over_email_send_rate_limit: 'Trop de demandes : réessayez dans une heure.',
};
app.addEventListener('submit', async e => {
  const f = e.target; e.preventDefault();
  const v = Object.fromEntries(new FormData(f));
  const btn = f.querySelector('[type="submit"]'); if (btn) btn.disabled = true;
  try {
    if (f.id === 'join-form') {
      joinMsg = ''; joinDraft = { code: v.code || '', name: v.name || '' };
      if (!/^\d{4}$/.test(v.pin || '')) throw new Error(JOIN_ERRORS.PIN_FORMAT);
      await cloudJoin(v.code, v.name, v.pin);
      toast(`Bienvenue ${store.d.cloud.name} : tes résultats seront envoyés à ton professeur.`, 'check');
    }
    if (f.id === 'prof-form') {
      P.error = ''; P.msg = ''; profDraft = v.email || '';
      if (P.signup) {
        const r = await sb('/auth/v1/signup', { method: 'POST', body: { email: v.email, password: v.password } });
        if (r.access_token) store.d.prof = { access_token: r.access_token, refresh_token: r.refresh_token, expires_at: r.expires_at || Date.now() / 1000 + r.expires_in, email: v.email };
        else { P.signup = false; P.msg = 'Compte créé. Ouvrez l’e-mail de confirmation, puis connectez-vous ici.'; }
      } else {
        const r = await sb('/auth/v1/token?grant_type=password', { method: 'POST', body: { email: v.email, password: v.password } });
        store.d.prof = { access_token: r.access_token, refresh_token: r.refresh_token, expires_at: r.expires_at || Date.now() / 1000 + r.expires_in, email: v.email };
      }
      store.save(); P.key = '';
    }
    if (f.id === 'work-form') {
      const c = P.classes.find(x => x.id === route.cls);
      const body = { class_id: c.id, level: c.level, n: Number(v.n) || 10, due: v.due || null, grp: v.grp || null };
      if (v.src === 'rework') {
        const agg = {};
        for (const r of P.stats || []) { const k = r.level + '|' + r.category; const x = (agg[k] ||= { level: r.level, category: r.category, total: 0, correct: 0 }); x.total += r.total; x.correct += r.correct; }
        body.categories = analyse(Object.values(agg)).notions.filter(n => n.total >= 10 && n.rate < .7 && n.level === c.level).sort((a, b) => a.rate - b.rate).slice(0, 8).map(n => n.category);
        if (!body.categories.length) throw new Error('Pas encore de notions à retravailler pour ce niveau.');
        body.title = (v.title || '').trim() || 'Notions à retravailler';
      } else {
        body.chapter = v.src.slice(3);
        body.title = (v.title || '').trim() || ((DATA.chapters[c.level] || []).find(ch => ch.id === body.chapter) || {}).name || 'Devoir';
      }
      await api('/rest/v1/assignments', { method: 'POST', body, prefer: 'return=minimal' });
      toast('Devoir donné', 'check'); P.key = ''; profLoad(true);
    }
    if (f.id === 'class-form') {
      if (!v.name.trim()) throw new Error('Donnez un nom à la classe.');
      await api('/rest/v1/classes', { method: 'POST', body: { name: v.name.trim(), level: v.level }, prefer: 'return=minimal' });
      toast('Classe créée', 'check'); P.key = ''; profLoad(true);
    }
  } catch (err) {
    const m = AUTH_ERRORS[err.code] || err.message;
    if (f.id === 'join-form') joinMsg = m; else P.error = m;
  }
  render();
});

app.addEventListener('click', async e => {
  const g = e.target.closest('[data-grp-set], [data-adapt]');
  if (g && route.tab === 'prof' && route.stu) {
    const st = P.students.find(x => x.id === route.stu); if (!st) return;
    try {
      if (g.dataset.grpSet != null) await patchStudent(st.id, { grp: g.dataset.grpSet || null });
      else {
        const a = { ...(st.adapt || {}) }, k = g.dataset.adapt;
        if (k === 'dys' || k === 'tts') a[k] = !a[k];
        if (k === 'size') a.size = a.size > 1 ? undefined : 1.2;
        if (k === 't133') a.time = a.time > 1 ? undefined : 1.33;
        if (k === 't0') a.time = a.time === 0 ? undefined : 0;
        Object.keys(a).forEach(x => (a[x] === undefined || a[x] === false) && delete a[x]);
        await patchStudent(st.id, { adapt: a });
      }
      render();
    } catch (err) { P.error = err.message; render(); }
    return;
  }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'cloud-leave' && await confirmSheet('Changer d’élève ?', 'Cet appareil ne sera plus relié à ta classe. Tes résultats déjà envoyés restent chez ton professeur.', 'Changer', 'Annuler')) { cloudLeave(); store.d.stats = {}; store.save(); render(); }
  if (act === 'prof-toggle') { P.signup = !P.signup; P.error = ''; P.msg = ''; render(); }
  if (act === 'prof-logout') { delete store.d.prof; store.save(); Object.assign(P, { key: '', classes: null, students: null, stats: null }); render(); }
  if (act === 'class-del') {
    const c = P.classes.find(x => x.id === route.cls);
    if (await confirmSheet(`Supprimer ${c.name} ?`, 'Les élèves inscrits et tous leurs résultats seront effacés définitivement.', 'Supprimer', 'Annuler')) {
      try { await api(`/rest/v1/classes?id=eq.${c.id}`, { method: 'DELETE' }); toast('Classe supprimée', 'check'); go('#/prof'); profLoad(true); } catch (err) { P.error = err.message; render(); }
    }
  }
  if (act === 'stu-del') {
    const s = P.students.find(x => x.id === route.stu);
    if (await confirmSheet(`Retirer ${s.name} ?`, 'Ses résultats seront effacés définitivement.', 'Retirer', 'Annuler')) {
      try { await api(`/rest/v1/students?id=eq.${s.id}`, { method: 'DELETE' }); toast('Élève retiré', 'check'); go(`#/prof/${s.class_id}`); profLoad(true); } catch (err) { P.error = err.message; render(); }
    }
  }
  if (act === 'work-del') {
    if (await confirmSheet('Supprimer ce devoir ?', 'Les résultats déjà rendus seront effacés.', 'Supprimer', 'Annuler')) {
      try { await api(`/rest/v1/assignments?id=eq.${t.dataset.id}`, { method: 'DELETE' }); toast('Devoir supprimé', 'check'); P.key = ''; profLoad(true); } catch (err) { P.error = err.message; render(); }
    }
  }
  if (act === 'auto-groups') {
    const stu = P.students.filter(x => x.class_id === route.cls);
    const plan = stu.map(x => { const a = analyse(rowsFor([x.id])); return { x, g: a.total < 10 ? null : a.rate < .6 ? 'Consolider' : a.rate < .8 ? 'Progresser' : 'Approfondir' }; });
    const n = plan.filter(p => p.g).length;
    if (!n) { toast('Pas encore assez de réponses (10 par élève au moins).', 'cross'); return; }
    if (await confirmSheet('Répartir en 3 groupes ?', `${n} élève${n > 1 ? 's' : ''} avec au moins 10 réponses : moins de 60 % → Consolider, 60 à 80 % → Progresser, plus de 80 % → Approfondir. Vous pourrez ajuster élève par élève.`, 'Répartir', 'Annuler')) {
      try { for (const p of plan) if (p.g && p.g !== p.x.grp) await patchStudent(p.x.id, { grp: p.g }); toast('Groupes mis à jour', 'check'); render(); } catch (err) { P.error = err.message; render(); }
    }
  }
  if (act === 'stu-pin') {
    const pin = String(Math.floor(1000 + Math.random() * 9000));
    const s = P.students.find(x => x.id === route.stu);
    if (await confirmSheet(`Nouveau code : ${pin}`, `Donnez ce code à ${s.name}. L’ancien ne fonctionnera plus et l’élève devra se reconnecter.`, 'Valider ce code', 'Annuler')) {
      try { const r = await rpc('mq_reset_pin', { p_student: s.id, p_pin: pin }, await profToken()); if (r.error) throw new Error('Action refusée.'); toast(`Code de ${s.name} : ${pin}`, 'check'); } catch (err) { P.error = err.message; render(); }
    }
  }
});

// ---- onboard.js
/* Première ouverture : choisir sa classe, puis le test de positionnement ou le jeu direct. */

let onboardEl = null;
function startOnboarding() {
  if (onboardEl) onboardEl.remove();
  onboardEl = document.createElement('div');
  onboardEl.className = 'onboard';
  onboardEl.setAttribute('role', 'dialog');
  onboardEl.setAttribute('aria-modal', 'true');
  onboardEl.setAttribute('aria-labelledby', 'ob-t');
  document.body.appendChild(onboardEl);
  document.body.style.overflow = 'hidden';
  onboardStep(1);
}
function onboardStep(n) {
  const lv = store.d.level;
  if (n === 1) {
    onboardEl.innerHTML = `<div class="ob-in">
      <div class="wordmark">MATH<span>QUEST</span></div>
      <h1 id="ob-t" class="display">Bienvenue</h1>
      <p class="ob-lead">Des automatismes de maths en séries de cinq minutes. Ta progression reste sur cet appareil.</p>
      <h2 class="cond">En quelle classe es-tu ?</h2>
      <div class="ob-levels">${LEVEL_IDS.map(id => `<button class="ob-level" data-level="${id}" data-ob-level="${id}"><b>${LEVELS[id].short}</b><span>${LEVELS[id].name}</span></button>`).join('')}</div>
    </div>`;
    onboardEl.querySelector('.ob-level').focus();
  } else {
    document.documentElement.dataset.level = lv;
    onboardEl.innerHTML = `<div class="ob-in">
      <div class="wordmark">MATH<span>QUEST</span></div>
      <h1 id="ob-t" class="display">${LEVELS[lv].short}, c’est parti</h1>
      <p class="ob-lead">Par quoi veux-tu commencer ?</p>
      <div class="modes">
        <button class="mode" data-ob="place"><span class="ico">${icon('chart')}</span><span><b>Test de positionnement</b><small>${placementQuestions(lv).length} questions, sans chrono, environ 5 minutes. MathQuest saura par où commencer.</small></span>${icon('next')}</button>
        <button class="mode" data-ob="play"><span class="ico">${icon('play')}</span><span><b>Jouer tout de suite</b><small>Tu pourras faire le test plus tard depuis l’accueil.</small></span>${icon('next')}</button>
        ${cloudOn() ? `<button class="mode" data-ob="class"><span class="ico">${icon('crowd')}</span><span><b>J’ai un code de classe</b><small>Ton professeur suivra tes progrès.</small></span>${icon('next')}</button>` : ''}
      </div>
      <p class="ob-foot"><button class="link" data-ob="settings">Besoin d’aménagements (police dys, lecture à voix haute, tiers-temps) ?</button></p>
      <p class="ob-foot"><button class="link" data-ob="back">${icon('back', 'sm')} Changer de classe</button></p>
    </div>`;
    onboardEl.querySelector('.mode').focus();
  }
}
function endOnboarding() {
  store.d.onboarded = true; store.save();
  if (onboardEl) { onboardEl.remove(); onboardEl = null; }
  document.body.style.overflow = '';
}
document.addEventListener('click', e => {
  if (!onboardEl || !onboardEl.contains(e.target)) return;
  const lvB = e.target.closest('[data-ob-level]');
  if (lvB) { store.d.level = lvB.dataset.obLevel; store.save(); onboardStep(2); return; }
  const b = e.target.closest('[data-ob]'); if (!b) return;
  const act = b.dataset.ob;
  if (act === 'back') return onboardStep(1);
  endOnboarding();
  if (act === 'place') startPlacement(store.d.level);
  else if (act === 'class') go('#/progres');
  else if (act === 'settings') go('#/reglages');
  else render();
});

// ---- session.js
/* Séries en solo.
   train     Entraînement : correction et méthode après chaque erreur, coup de pouce, question de rattrapage.
   review    Révisions du jour : les notions dont la date de révision est arrivée (révisions espacées).
   homework  Devoir donné par le professeur : comme l'entraînement.
   exam      Examen : chronométré, correction à la fin.
   daily     Défi du jour : les mêmes 10 questions pour tous, correction à la fin.
   sprint    Chrono : un maximum de bonnes réponses en 60 secondes.
   place     Test de positionnement : 2 questions par chapitre, sans chrono, bilan par chapitre. */

const EXAM_MS = 9 * 60 * 1000, SPRINT_MS = 60 * 1000, MAX_REMEDY = 5;
const MODES = {
  train: { n: 20, feedback: true, help: true, remedy: true, label: 'Entraînement' },
  review: { n: 12, feedback: true, help: true, remedy: true, label: 'Révisions du jour' },
  homework: { n: 10, feedback: true, help: true, remedy: true, label: 'Devoir' },
  exam: { n: 20, feedback: false, clock: EXAM_MS, label: 'Examen' },
  daily: { feedback: false, label: 'Défi du jour' },
  place: { feedback: false, label: 'Test de positionnement' },
  sprint: { feedback: 'flash', clock: SPRINT_MS, stream: true, label: 'Chrono' },
};
let session = null;

function overlay(cls) {
  const el = document.createElement('div');
  el.className = cls;
  document.body.appendChild(el);
  document.body.style.overflow = 'hidden';
  if (!(history.state && history.state.overlay)) history.pushState({ overlay: true }, '');
  return el;
}
function closeOverlay(el, keepHistory) {
  el.remove();
  document.body.style.overflow = '';
  stopSpeaking();
  if (!keepHistory && history.state && history.state.overlay) history.back();
}

/* opts : { lv, chapter, mode, pool, qs?, n?, assignment? } */
function startSession(opts) {
  const { lv, chapter, mode, pool } = opts;
  const M = MODES[mode] || MODES.train;
  let qs;
  if (opts.qs) qs = [...opts.qs];
  else if (M.stream) qs = [];
  else qs = pickQuestions(pool, opts.n || M.n, weakCats(lv), lv);
  const stream = M.stream ? { list: shuffle(pool), k: 0 } : null;
  if (stream && !stream.list.length) { toast('Aucune question disponible ici.', 'cross'); return; }
  if (!stream && !qs.length) { toast('Aucune question disponible ici.', 'cross'); return; }
  if (store.touchDay()) store.save();
  const clockMs = M.clock ? (mode === 'sprint' ? (timed(SPRINT_MS) || SPRINT_MS * 1.5) : timed(M.clock)) : null;
  session = {
    opts, M, lv, chapter, mode, pool: pool || qs, qs, stream, i: 0, input: '', log: [], helped: {}, remedies: 0,
    combo: 0, xp: 0, busy: false, t0: Date.now(), qStart: Date.now(), clockMs, deadline: 0,
    el: overlay('play'), timer: null,
  };
  if (stream) nextFromStream();
  document.documentElement.dataset.level = lv;
  drawQuestion();
  dropCountdown(session.el, () => {
    const s = session; if (!s) return;
    s.qStart = Date.now(); s.t0 = Date.now();
    if (s.clockMs) { s.deadline = Date.now() + s.clockMs; s.timer = setInterval(tickClock, 250); }
    if (prefsEff().tts && prefsEff().autoRead) readQuestion(s.qs[s.i], s.choices);
  });
}
function nextFromStream() {
  const s = session, st = s.stream;
  if (st.k >= st.list.length) { st.list = shuffle(st.list); st.k = 0; }
  s.qs.push(st.list[st.k++]);
}

/* Lancement façon « drop » : 3·2·1, puis la première question. */
function dropCountdown(host, done) {
  const box = document.createElement('div');
  box.className = 'count3';
  host.appendChild(box);
  const steps = reduceMotion() ? ['Go'] : ['3', '2', '1', 'Go'];
  steps.forEach((s, i) => setTimeout(() => {
    box.innerHTML = `<div><b>${s}</b><span>${s === 'Go' ? 'C’est parti' : 'Prêt ?'}</span></div>`;
    s === 'Go' ? sfx.go() : sfx.tick();
  }, i * 600));
  setTimeout(() => { box.remove(); done(); }, steps.length * 600);
}

function quitSession(force) {
  const s = session; if (!s) return;
  clearInterval(s.timer);
  session = null;
  closeOverlay(s.el, force);
  if (!force) render();
}
async function askQuit() {
  const s = session; if (!s) return;
  if (!s.log.length || s.finished) { quitSession(); return; }
  const ok = await confirmSheet('Quitter la série ?', 'Tes réponses déjà données restent comptées dans ta progression.', 'Quitter', 'Continuer');
  if (ok) quitSession();
}

function clock(ms) { const t = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; }
function runHTML(s) {
  if (s.mode === 'sprint') {
    const good = s.log.filter(l => l && l.ok).length;
    return `<div class="sprint-score" aria-live="polite"><b>${good}</b><span>bonne${good > 1 ? 's' : ''} réponse${good > 1 ? 's' : ''}</span></div>`;
  }
  return `<div class="run" aria-hidden="true">${s.qs.map((q, k) => {
    const l = s.log[k];
    const cls = l ? (s.M.feedback ? (l.ok ? 'ok' : 'ko') : 'ok') : k === s.i ? 'now' : '';
    return `<i class="${cls}${q.remedy ? ' rem' : ''}"></i>`;
  }).join('')}</div>`;
}
function countText(s) {
  if (s.clockMs) return s.deadline ? clock(s.deadline - Date.now()) : clock(s.clockMs);
  return `${s.i + 1}/${s.qs.length}`;
}

function drawQuestion() {
  const s = session, q = s.qs[s.i];
  const choice = !!q.options;
  s.input = ''; s.busy = false; s.qStart = Date.now(); s.choices = choice ? shuffle(q.options) : null;
  const prompt = promptOf(q);
  const p = prefsEff();
  const method = s.M.help ? methodFor(s.lv, q) : null;
  s.el.innerHTML = `<div class="play-in">
    <div class="play-head">
      <button class="icon-btn" data-k="quit" aria-label="Quitter la série">${icon('close')}</button>
      ${runHTML(s)}
      <span class="count" aria-live="off">${countText(s)}</span>
    </div>
    <div class="q-zone">
      <div class="q-meta">
        ${q.remedy ? '<span class="chip">Rattrapage</span>' : ''}
        ${s.mode === 'place' ? '' : `<span class="tier" title="${TIER_NAMES[q.d || 2]}" aria-label="${TIER_NAMES[q.d || 2]}">${[1, 2, 3].map(k => `<i class="${k <= (q.d || 2) ? 'f' : ''}"></i>`).join('')}</span>`}
        <span class="grow"></span>
        ${p.tts && canSpeak() ? `<button class="mini" data-k="read" aria-label="Écouter la question">${icon('sound', 'sm')}<span>Écouter</span></button>` : ''}
        ${method ? `<button class="mini" data-k="help" aria-expanded="false">${icon('bulb', 'sm')}<span>Coup de pouce</span></button>` : ''}
      </div>
      <h2 class="q-text ${prompt.length > 48 ? 'long' : prompt.length <= 16 && !q.figure ? 'short' : ''}" id="q-text">${mathHTML(prompt)}</h2>
      ${q.figure ? `<div class="fig">${FIG(q.figure)}</div>` : ''}
      ${method ? `<div class="helpbox" id="helpbox" hidden><b>Coup de pouce :</b> ${mathHTML(method)}</div>` : ''}
    </div>
    <div class="a-zone">
      ${choice
        ? `<div class="choices" role="group" aria-labelledby="q-text">${s.choices.map((o, k) => `<button class="choice" data-c="${k}"><span class="l">${'ABCD'[k]}</span><span>${mathHTML(o)}</span></button>`).join('')}</div>`
        : `<div class="answer" aria-live="polite" aria-label="Ta réponse"><span class="ph">?</span></div>
           <div class="keypad" aria-label="Pavé numérique">${[['7'], ['8'], ['9'], ['del', icon('del'), 'Effacer'], ['4'], ['5'], ['6'], ['/', 'a/b', 'Barre de fraction'], ['1'], ['2'], ['3'], ['sign', icon('sign'), 'Changer le signe'], ['0'], [',', ',', 'Virgule'], ['ok', 'Valider', 'Valider']]
              .map(([k, t, a]) => `<button class="key ${['del', '/', 'sign', ','].includes(k) ? 'fn' : ''} ${k === 'ok' ? 'go' : ''}" data-k="${k}" ${a ? `aria-label="${a}"` : ''}>${t && t.startsWith('<svg') ? t : esc(t || k)}</button>`).join('')}</div>`}
    </div>
  </div>`;
  if (s.i > 0 && p.tts && p.autoRead) readQuestion(q, s.choices);
}

function drawInput() {
  const box = session.el.querySelector('.answer');
  if (!box) return;
  box.innerHTML = session.input ? `<span>${esc(showInput(session.input))}</span><span class="caret"></span>` : '<span class="ph">?</span>';
}

function tickClock() {
  const s = session; if (!s || !s.deadline) return;
  const left = s.deadline - Date.now();
  const c = s.el.querySelector('.count');
  if (c) { c.textContent = clock(left); c.classList.toggle('warn', left < Math.min(60000, s.clockMs / 4)); }
  if (left <= 0) { clearInterval(s.timer); finishSession(true); }
}

function submit(value) {
  const s = session; if (!s || s.busy || s.finished) return;
  const q = s.qs[s.i], choice = !!q.options;
  if (!choice && !value) return;
  const ok = isRight(value, q.answer, choice);
  const helped = !!s.helped[s.i];
  s.busy = true;
  stopSpeaking();
  s.log[s.i] = { q, given: value, ok, helped, ms: Date.now() - s.qStart };
  store.record(s.lv, q.category, ok);
  if (ok) { s.combo++; s.xp += helped ? 5 : 10 + (s.combo >= 3 ? 5 : 0); } else s.combo = 0;
  store.save();

  if (!s.M.feedback) { sfx.tap(); return advance(); }

  if (s.M.feedback === 'flash') { // chrono : un éclair, puis on enchaîne
    const zone = s.el.querySelector('.a-zone');
    ok ? (sfx.good(), buzz(15)) : (sfx.bad(), buzz([20, 30, 20]));
    const f = document.createElement('div');
    f.className = `flash-mini ${ok ? 'ok' : 'ko'}`; f.setAttribute('role', 'status');
    f.innerHTML = ok ? `<b>${icon('check')}</b>` : `<b>${answerHTML(q.answer, choice)}</b><span>était la bonne réponse</span>`;
    zone.appendChild(f);
    setTimeout(advance, ok ? 260 : 1100);
    return;
  }

  const btns = s.el.querySelectorAll('.choice');
  if (choice) btns.forEach(b => { b.disabled = true; const o = s.choices[+b.dataset.c]; if (o === q.answer) b.classList.add('right'); else if (o === value) b.classList.add('wrong'); });
  if (ok) {
    s.combo % 5 === 0 ? sfx.combo() : sfx.good(); buzz(20);
    const f = document.createElement('div');
    f.className = 'flip'; f.setAttribute('role', 'status');
    f.innerHTML = `<div><b>${s.combo >= 3 ? `×${s.combo}` : 'Juste'}</b><span>${helped ? 'avec le coup de pouce, +5 XP' : s.combo >= 3 ? `${s.combo} d'affilée, +15 XP` : '+10 XP'}</span></div>`;
    s.el.appendChild(f);
    setTimeout(advance, reduceMotion() ? 700 : 520);
  } else {
    sfx.bad(); buzz([30, 40, 30]);
    // Remédiation : une autre question de la même notion revient un peu plus loin.
    let remedyMsg = '';
    if (s.M.remedy && s.remedies < MAX_REMEDY) {
      const used = new Set(s.qs);
      const r = sameNotion(q, s.pool, used);
      if (r) { s.qs.splice(Math.min(s.i + 3, s.qs.length), 0, { ...r, remedy: true }); s.remedies++; remedyMsg = '<p class="remedy-note">Une question de rattrapage sur cette notion arrive dans quelques questions.</p>'; }
    }
    const zone = s.el.querySelector('.a-zone');
    zone.classList.add('shake');
    const method = methodFor(s.lv, q);
    const showHint = q.hint && q.hint !== method;
    zone.innerHTML = `<div class="fix" role="alert">
      <div class="head"><span class="dot">${icon('cross', 'sm')}</span>Pas tout à fait</div>
      <p class="yours">Ta réponse : <s>${choice ? mathHTML(value) : esc(showInput(value))}</s></p>
      <p class="good">Bonne réponse<strong>${answerHTML(q.answer, choice)}</strong></p>
      ${method ? `<p class="how"><b>Méthode :</b> ${mathHTML(method)}</p>` : ''}
      ${showHint ? `<p class="how-2">${mathHTML(q.hint)}</p>` : ''}
      ${remedyMsg}
      <p class="notion-name">Notion : ${esc(q.category)}</p>
      <button class="btn ink block" data-k="next">${s.i + 1 < s.qs.length ? 'Question suivante' : 'Voir mon score'} ${icon('next', 'sm')}</button></div>`;
    zone.querySelector('[data-k="next"]').focus();
  }
}

function advance() {
  const s = session; if (!s || s.finished) return;
  s.i++;
  if (s.stream) { if (s.i >= s.qs.length) nextFromStream(); return drawQuestion(); }
  if (s.i >= s.qs.length) finishSession(false); else drawQuestion();
}

/* ---------- Fin de série ---------- */
function perCategory(log) {
  const by = {};
  for (const l of log.filter(Boolean)) { const c = (by[l.q.category] ||= { t: 0, k: 0 }); c.t++; if (l.ok) c.k++; }
  return by;
}
function finishSession(timeUp) {
  const s = session; if (!s || s.finished) return;
  clearInterval(s.timer);
  stopSpeaking();
  if (s.stream && !s.log[s.i]) s.qs.length = s.i; // la question en cours au gong ne compte pas
  const done = s.log.filter(Boolean);
  const good = done.filter(l => l.ok).length;
  const total = s.stream ? done.length : s.qs.length;
  if (s.mode === 'exam' || s.mode === 'daily') s.xp = good * 10 + (good === total ? 30 : 0);
  if (s.mode === 'place') s.xp = 50;
  if (s.mode === 'sprint') s.xp = good * 5;
  const before = s.chapter && s.chapter.prefixes ? chapterStats(s.lv, s.chapter) : null;
  store.d.xp += s.xp;

  // Révisions espacées, compteurs, records
  srsUpdate(s.lv, perCategory(s.log));
  const c = counts();
  bump('series'); bump('good', good);
  if (['train', 'review', 'homework'].includes(s.mode) && total >= 10 && good === total) bump('perfect');
  if (s.mode === 'review') bump('review');
  if (s.mode === 'place') { bump('placed'); (store.d.placed ||= {})[s.lv] = today(); }
  if (s.mode === 'sprint') {
    c.sprint = Math.max(c.sprint || 0, good);
    const best = ((store.d.best ||= {}).sprint ||= {});
    s.record = good > (best[s.lv] || 0); best[s.lv] = Math.max(best[s.lv] || 0, good); s.best = best[s.lv];
  }
  if (s.mode === 'daily') {
    const prev = dailyState(s.lv);
    if (!prev) bump('daily');
    const ms = Date.now() - s.t0;
    if (!prev || good > prev.score || (good === prev.score && ms < prev.ms)) (store.d.daily ||= {})[s.lv] = { date: today(), score: good, ms };
  }
  if (s.mode === 'homework' && s.opts.assignment && store.d.cloud) (store.d.cloud.done ||= {})[s.opts.assignment] = { score: good, total };
  store.save();
  cloudRecordSession(s);
  s.finished = { wrong: done.filter(l => !l.ok).map(l => l.q) };
  s.el.innerHTML = s.mode === 'place' ? placementResultHTML(s) : resultHTML(s, good, total, timeUp);
  sfx.win();
  const after = s.chapter && s.chapter.prefixes ? chapterStats(s.lv, s.chapter) : null;
  if (after && after.medal && (!before || !before.medal || before.medal !== after.medal)) setTimeout(() => toast(`Médaille ${after.medal.label.toLowerCase()} débloquée : ${s.chapter.name}`), 600);
  checkTrophies();
}

function resultHTML(s, good, total, timeUp) {
  const done = s.log.filter(Boolean);
  const rate = total ? good / total : 0;
  const used = Date.now() - s.t0;
  const wrong = done.filter(l => !l.ok);
  const helped = done.filter(l => l.helped).length;
  let title, line, advice;
  if (s.mode === 'sprint') {
    title = s.record && good ? 'Record' : 'Chrono';
    line = `${plural(good, 'bonne réponse', 'bonnes réponses')} en ${clock(s.clockMs)} · record : ${s.best}`;
    advice = good >= 15 ? 'Rapide et juste : garde ce rythme.' : 'Vise la justesse d’abord : la vitesse vient avec l’entraînement.';
  } else {
    title = rate === 1 ? 'Sans faute' : rate >= .9 ? 'Excellent' : rate >= .75 ? 'Très bien' : rate >= .5 ? 'Bien joué' : 'À retravailler';
    line = `${esc((s.chapter && s.chapter.name) || s.M.label)}${s.mode === 'exam' ? ` · examen ${timeUp ? 'terminé au chrono' : `en ${clock(used)}`}` : s.mode === 'daily' ? ` · en ${clock(used)}` : ''}`;
    advice = s.mode === 'daily' ? 'Un nouveau défi t’attend demain : les mêmes 10 questions pour tous les élèves de ton niveau.'
      : rate >= .75 ? 'Tu maîtrises bien ces automatismes. Les révisions du jour te les feront revoir au bon moment.'
      : rate >= .5 ? 'C’est en bonne voie. Relis les méthodes ci-dessous puis relance une série.'
      : 'Prends le temps de relire chaque méthode, puis refais une série sur les erreurs.';
  }
  const ledger = s.mode === 'exam' || s.mode === 'daily'
    ? `<div class="sec"><h2>Relevé</h2><span class="muted" style="font-size:13px">${clock(used)}${s.clockMs ? ` sur ${clock(s.clockMs)}` : ''}</span></div>
      <table class="ledger"><thead><tr><th>#</th><th>Question</th><th>Temps</th><th><span class="sr">Résultat</span></th></tr></thead><tbody>
      ${s.qs.map((q, k) => { const l = s.log[k]; return `<tr><td>${k + 1}</td><td class="q">${mathHTML(promptOf(q))}</td><td>${l ? `${(l.ms / 1000).toFixed(1).replace('.', ',')} s` : '–'}</td><td>${l ? `<span class="mark ${l.ok ? 'ok' : 'ko'}" aria-label="${l.ok ? 'juste' : 'faux'}">${icon(l.ok ? 'check' : 'cross')}</span>` : '<span class="mark ko" aria-label="sans réponse">' + icon('cross') + '</span>'}</td></tr>`; }).join('')}
      </tbody></table>` : '';
  const again = s.mode === 'daily' ? 'Rejouer le défi' : s.mode === 'sprint' ? 'Rejouer' : 'Nouvelle série';
  return `<div class="shell res" style="padding-bottom:32px;overflow-y:auto;height:100%">
    <div class="top"><div class="wordmark">MATH<span>QUEST</span></div><button class="icon-btn" data-k="home" aria-label="Fermer">${icon('close')}</button></div>
    <div class="layout">
      <div class="side">
        <section class="drop" aria-labelledby="res-title">
          <h1 id="res-title">${title}</h1>
          <p class="score" aria-label="${good} sur ${total}">${good}${s.mode === 'sprint' ? '' : `<small>/${total}</small>`}</p>
          <p>${line}</p>
          <div class="gains">${s.xp ? `<span class="pill">${icon('bolt')}+${s.xp} XP</span>` : ''}${helped ? `<span class="pill">${icon('bulb')}${helped} coup${helped > 1 ? 's' : ''} de pouce</span>` : ''}${s.mode === 'exam' && done.length < total ? `<span class="pill">${total - done.length} sans réponse</span>` : ''}</div>
        </section>
      </div>
      <div class="main">
        <p class="note" style="margin-top:24px">${advice}</p>
        ${ledger}
        ${wrong.length ? `<div class="sec"><h2>Tes erreurs</h2></div><div class="review">${wrong.map(l => `<article>
            <p class="qq">${mathHTML(promptOf(l.q))}</p>
            <p class="aa">Ta réponse : <s>${l.q.options ? mathHTML(l.given) : esc(showInput(l.given))}</s> · Bonne réponse : <strong>${answerHTML(l.q.answer, !!l.q.options)}</strong></p>
            ${methodFor(s.lv, l.q) ? `<p class="hh">${mathHTML(methodFor(s.lv, l.q))}</p>` : ''}</article>`).join('')}</div>` : ''}
        <div class="bottom-actions">
          ${wrong.length ? '<button class="btn ink block" data-k="redo">Refaire mes erreurs</button>' : ''}
          <button class="btn ${wrong.length ? 'line' : 'ink'} block" data-k="again">${again}</button>
          <button class="btn line block" data-k="home">Retour à l’accueil</button>
        </div>
      </div>
    </div></div>`;
}

function placementResultHTML(s) {
  const lv = s.lv;
  const rows = DATA.chapters[lv].map(ch => {
    const ls = s.log.filter(l => l && l.q.chapter === ch.id);
    const k = ls.filter(l => l.ok).length;
    return { ch, k, n: ls.length };
  }).filter(r => r.n);
  const weakest = [...rows].sort((a, b) => a.k / a.n - b.k / b.n)[0];
  const label = r => r.k === r.n ? 'Acquis' : r.k === 0 ? 'À travailler' : 'En cours';
  const good = s.log.filter(l => l && l.ok).length;
  return `<div class="shell res" style="padding-bottom:32px;overflow-y:auto;height:100%">
    <div class="top"><div class="wordmark">MATH<span>QUEST</span></div><button class="icon-btn" data-k="home" aria-label="Fermer">${icon('close')}</button></div>
    <div class="layout">
      <div class="side">
        <section class="drop" aria-labelledby="res-title">
          <h1 id="res-title" style="--tw:11">Ton point de départ</h1>
          <p class="score" aria-label="${good} sur ${s.qs.length}">${good}<small>/${s.qs.length}</small></p>
          <p>Test de positionnement de ${LEVELS[lv].short}. Ces réponses règlent déjà la difficulté de tes prochaines séries.</p>
          ${weakest ? `<div class="actions"><button class="btn ink" data-k="startch" data-ch="${weakest.ch.id}">Commencer par ${esc(weakest.ch.name)} ${icon('next', 'sm')}</button></div>` : ''}
        </section>
      </div>
      <div class="main">
        <div class="sec"><h2>Chapitre par chapitre</h2></div>
        <div class="rows">${rows.map(r => `<div class="row static"><div><div class="n">${esc(r.ch.name)}</div><div class="s">${r.k}/${r.n} · ${label(r)}</div></div>
          <span class="cells" aria-hidden="true">${Array.from({ length: r.n }, (_, i) => `<i class="${i < r.k ? 'f' : ''}"></i>`).join('')}</span></div>`).join('')}</div>
        <div class="bottom-actions"><button class="btn line block" data-k="home">Retour à l’accueil</button></div>
      </div>
    </div></div>`;
}

/* ---------- Lanceurs ---------- */
function startPlacement(lv) {
  startSession({ lv, chapter: { id: 'place', name: 'Test de positionnement' }, mode: 'place', qs: shuffle(placementQuestions(lv)) });
}
function startDaily(lv) {
  startSession({ lv, chapter: { id: 'daily', name: 'Défi du jour' }, mode: 'daily', qs: dailyQuestions(lv) });
}
function startSprint(lv) {
  startSession({ lv, chapter: { id: 'sprint', name: 'Chrono' }, mode: 'sprint', pool: sprintPool(lv) });
}
function startReview(lv) {
  const { due, pool } = reviewPool(lv);
  if (!pool.length) { toast('Rien à réviser aujourd’hui. Reviens demain !', 'check'); return; }
  startSession({ lv, chapter: { id: 'review', name: 'Révisions du jour' }, mode: 'review', pool, n: Math.min(12, Math.max(6, due.length * 2)) });
}

document.addEventListener('click', e => {
  const s = session; if (!s || !s.el.contains(e.target)) return;
  const b = e.target.closest('button'); if (!b) return;
  const k = b.dataset.k;
  if (b.dataset.c != null) { if (!s.busy) submit(s.choices[+b.dataset.c]); return; }
  if (k === 'quit') return askQuit();
  if (k === 'next') return advance();
  if (k === 'home') return quitSession();
  if (k === 'read') return readQuestion(s.qs[s.i], s.choices);
  if (k === 'help') {
    const box = s.el.querySelector('#helpbox'); if (!box || s.busy) return;
    box.hidden = !box.hidden; b.setAttribute('aria-expanded', String(!box.hidden));
    if (!box.hidden) { s.helped[s.i] = true; if (prefsEff().tts) speak(box.textContent); }
    return;
  }
  if (k === 'startch') { const ch = chapterById(s.lv, b.dataset.ch); quitSession(true); return startSession({ lv: s.lv, chapter: ch, mode: 'train', pool: questionsOf(s.lv, ch.id) }); }
  if (k === 'again') {
    const o = s.opts; quitSession(true);
    if (o.mode === 'review') return startReview(o.lv);
    if (o.mode === 'daily') return startDaily(o.lv);
    return startSession({ ...o, qs: o.mode === 'place' ? o.qs : undefined });
  }
  if (k === 'redo') { const { lv, chapter } = s; const pool = s.finished.wrong; quitSession(true); return startSession({ lv, chapter: { id: 'weak', name: `Erreurs : ${(chapter && chapter.name) || ''}` }, mode: 'train', pool, n: Math.max(pool.length, 5) }); }
  if (s.busy || s.finished || !k) return;
  if (k === 'ok') return submit(s.input);
  s.input = typeKey(s.input, k); sfx.tap(); drawInput();
});

/* Clavier d'ordinateur : chiffres, virgule ou point, /, -, Retour arrière, Entrée ; A-D pour les QCM ; H coup de pouce. */
document.addEventListener('keydown', e => {
  const s = session; if (!s || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('dialog[open]')) return;
  if (e.key === 'Escape') { e.preventDefault(); return s.finished ? quitSession() : askQuit(); }
  if (s.finished) return;
  const q = s.qs[s.i];
  if (s.busy) { if (e.key === 'Enter' && s.el.querySelector('[data-k="next"]') && document.activeElement?.dataset?.k !== 'next') { e.preventDefault(); advance(); } return; }
  if (e.key.toLowerCase() === 'h' && s.el.querySelector('[data-k="help"]')) { e.preventDefault(); s.el.querySelector('[data-k="help"]').click(); return; }
  if (q.options) {
    const k = 'abcd'.indexOf(e.key.toLowerCase()), n = '1234'.indexOf(e.key), idx = k >= 0 ? k : n;
    if (idx >= 0 && idx < s.choices.length) { e.preventDefault(); submit(s.choices[idx]); }
    return;
  }
  const map = { Backspace: 'del', Enter: 'ok', ',': ',', '.': ',', '/': '/', '-': 'sign' };
  const k = /^\d$/.test(e.key) ? e.key : map[e.key];
  if (!k) return;
  e.preventDefault();
  const key = s.el.querySelector(`.key[data-k="${CSS.escape(k)}"]`);
  if (key) { key.classList.add('hit'); setTimeout(() => key.classList.remove('hit'), 90); }
  if (k === 'ok') return submit(s.input);
  s.input = typeKey(s.input, k); drawInput();
});

window.addEventListener('popstate', async () => {
  if (session && !session.finished && session.log.length) {
    history.pushState({ overlay: true }, '');
    askQuit();
  } else if (session) { const s = session; clearInterval(s.timer); session = null; stopSpeaking(); s.el.remove(); document.body.style.overflow = ''; render(); }
  else if (arena) { arenaBack(); }
});

// ---- duo.js
/* Duel (2 joueurs, tir à la corde) et Battle (2 à 4 joueurs, premier à 5) sur un seul écran tactile. */

const DUEL_TARGET = 5, BATTLE_TARGET = 5;
let arena = null;

function startArena({ mode, n, lv, pool, names }) {
  if (pool.length < 10) { toast('Pas assez de questions courtes ici.', 'cross'); return; }
  if (store.touchDay()) store.save();
  arena = {
    mode, n, lv, names, pool, queue: [], used: 0,
    scores: Array(n).fill(0), combos: Array(n).fill(0), wrongThisRound: new Set(),
    rope: 0, round: 0, state: 'count', q: null, choices: null, timers: [], roundMs: mode === 'duel' ? 12000 : 10000,
    el: overlay('arena'),
  };
  document.documentElement.dataset.level = lv;
  layoutArena();
  countdown();
}

function zoneHTML(p, flipped) {
  return `<section class="zone ${flipped ? 'flipz' : ''}" data-p="${p}" aria-label="${esc(arena.names[p - 1])}">
    <div class="zh"><span class="who">${esc(arena.names[p - 1])}</span><span class="zs"></span></div>
    <div class="zq"></div>
    <div class="tiles"></div>
  </section>`;
}
function layoutArena() {
  const a = arena, el = a.el;
  const rope = `<div class="rope" aria-hidden="true"><div class="t"></div>${a.mode === 'duel' ? '<div class="knot">0</div>' : ''}</div>`;
  let html;
  if (a.n === 2) {
    el.className = `arena ${a.mode === 'duel' ? 'duel' : 'duel b2'}`;
    html = zoneHTML(2, true) + rope + zoneHTML(1, false);
  } else if (a.n === 3) {
    el.className = 'arena b3';
    html = zoneHTML(3, true) + rope + `<div class="row2">${zoneHTML(1, false)}<div class="gap"></div>${zoneHTML(2, false)}</div>`;
  } else {
    el.className = 'arena b4';
    html = `<div class="row2">${zoneHTML(4, true)}<div class="gap"></div>${zoneHTML(3, true)}</div>` + rope + `<div class="row2">${zoneHTML(1, false)}<div class="gap"></div>${zoneHTML(2, false)}</div>`;
  }
  el.innerHTML = html + `<button class="arena-x" data-ax="quit" aria-label="Quitter la partie">${icon('close')}</button>`;
  el.setAttribute('role', 'application');
  el.setAttribute('aria-label', a.mode === 'duel' ? 'Duel' : 'Battle');
  drawScores();
}
const zone = p => arena.el.querySelector(`.zone[data-p="${p}"]`);

function drawScores() {
  const a = arena;
  for (let p = 1; p <= a.n; p++) {
    const z = zone(p); if (!z) continue;
    const filled = a.mode === 'duel' ? Math.max(0, p === 1 ? a.rope : -a.rope) : a.scores[p - 1];
    const target = a.mode === 'duel' ? DUEL_TARGET : BATTLE_TARGET;
    const combo = a.combos[p - 1];
    z.querySelector('.zs').innerHTML = `${combo >= 2 ? `<span class="combo">${combo >= 3 ? '×2' : 'série ' + combo}</span>` : ''}<span class="pts" aria-label="${filled} sur ${target}">${Array.from({ length: target }, (_, k) => `<i class="${k < filled ? 'f' : ''}"></i>`).join('')}</span>`;
  }
  if (a.mode === 'duel') {
    const share = 50 + a.rope * 5;
    a.el.style.setProperty('--top', `${100 - share}fr`);
    a.el.style.setProperty('--bot', `${share}fr`);
    const k = a.el.querySelector('.knot'); if (k) k.textContent = a.rope === 0 ? '0' : `+${Math.abs(a.rope)}`;
  }
}

function later(fn, ms) { const t = setTimeout(fn, ms); arena.timers.push(t); return t; }
function clearArenaTimers() { if (!arena) return; arena.timers.forEach(clearTimeout); arena.timers = []; cancelAnimationFrame(arena.raf); }

function countdown() {
  const a = arena;
  const twin = a.n === 2 || a.n >= 3;
  const box = document.createElement('div');
  box.className = 'count3';
  a.el.appendChild(box);
  const steps = ['3', '2', '1', 'Go'];
  steps.forEach((s, i) => later(() => {
    const one = `<div><b>${s}</b><span>${s === 'Go' ? 'Tout le monde répond !' : 'Prêts ?'}</span></div>`;
    box.innerHTML = `<div style="display:grid;grid-template-rows:1fr 1fr;height:100%;width:100%;place-items:center">${twin ? `<div class="twin">${one}</div>` : '<div></div>'}${one}</div>`;
    s === 'Go' ? sfx.go() : sfx.tick();
  }, i * 650));
  later(() => { box.remove(); a.state = 'play'; nextRound(); }, steps.length * 650);
}

function drawTimer(ms) {
  const t = arena.el.querySelector('.rope .t');
  if (t) t.style.transform = `scaleX(${Math.max(0, ms / arena.roundMs)})`;
}

function nextRound() {
  const a = arena; if (!a) return;
  if (!a.queue.length) a.queue = shuffle(a.pool);
  let q, ch;
  do { q = a.queue.pop(); ch = q && choicesFor(q); } while (q && !ch && a.queue.length);
  if (!ch) { a.queue = shuffle(a.pool); return nextRound(); }
  a.q = q; a.choices = ch; a.round++; a.state = 'play'; a.wrongThisRound = new Set();
  const prompt = promptOf(q);
  for (let p = 1; p <= a.n; p++) {
    const z = zone(p);
    z.classList.remove('locked'); z.querySelector('.lock')?.remove(); z.querySelector('.flash')?.remove();
    const zq = z.querySelector('.zq');
    zq.className = `zq ${prompt.length > 34 ? 'long' : ''}`;
    zq.innerHTML = `<span>${mathHTML(prompt)}</span>`;
    z.querySelector('.tiles').innerHTML = ch.map((c, k) => `<button class="tile" data-t="${k}">${mathHTML(c.v)}</button>`).join('');
  }
  const start = performance.now();
  const loop = now => {
    if (!arena || arena.state !== 'play') return;
    const left = a.roundMs - (now - start);
    drawTimer(left);
    if (left <= 0) return reveal(null);
    a.raf = requestAnimationFrame(loop);
  };
  a.raf = requestAnimationFrame(loop);
}

function tap(p, k) {
  const a = arena; if (!a || a.state !== 'play') return;
  if (a.wrongThisRound.has(p)) return;
  const z = zone(p), btn = z.querySelector(`.tile[data-t="${k}"]`);
  if (a.choices[k].ok) {
    a.combos[p - 1]++;
    const pts = a.combos[p - 1] >= 3 ? 2 : 1;
    if (a.mode === 'duel') a.rope = Math.max(-DUEL_TARGET, Math.min(DUEL_TARGET, a.rope + (p === 1 ? pts : -pts)));
    else a.scores[p - 1] += pts;
    for (let o = 1; o <= a.n; o++) if (o !== p) a.combos[o - 1] = 0;
    a.combos[p - 1] >= 3 ? sfx.combo() : sfx.good(); buzz(25);
    const f = document.createElement('div'); f.className = 'flash'; f.innerHTML = `<b>${pts === 2 ? '+2' : '+1'}</b>`; z.appendChild(f);
    reveal(p);
  } else {
    btn.classList.add('wrong');
    a.combos[p - 1] = 0;
    a.wrongThisRound.add(p);
    z.classList.add('locked');
    const lk = document.createElement('span'); lk.className = 'lock'; lk.textContent = 'Bloqué'; z.querySelector('.zh').insertBefore(lk, z.querySelector('.zs'));
    sfx.bad(); buzz([20, 30, 20]);
    drawScores();
    if (a.wrongThisRound.size >= a.n) reveal(null);
  }
}

function reveal(winner) {
  const a = arena; if (!a || a.state !== 'play') return;
  a.state = 'reveal';
  cancelAnimationFrame(a.raf);
  const right = a.choices.findIndex(c => c.ok);
  a.el.querySelectorAll('.zone').forEach(z => {
    z.querySelectorAll('.tile').forEach((t, k) => { t.disabled = true; if (k === right) t.classList.add('right'); else if (!t.classList.contains('wrong')) t.classList.add('dim'); });
  });
  drawScores();
  const target = a.mode === 'duel' ? DUEL_TARGET : BATTLE_TARGET;
  const champ = a.mode === 'duel' ? (Math.abs(a.rope) >= target ? (a.rope > 0 ? 1 : 2) : 0) : (a.scores.findIndex(s => s >= target) + 1);
  if (champ) return later(() => endArena(champ), 900);
  if (a.round >= (a.mode === 'duel' ? 25 : 30)) return later(() => endArena(leader()), 900);
  later(nextRound, winner ? 1000 : 1500);
}
function leader() {
  const a = arena;
  if (a.mode === 'duel') return a.rope > 0 ? 1 : a.rope < 0 ? 2 : 0;
  const best = Math.max(...a.scores);
  const tops = a.scores.filter(s => s === best);
  return tops.length > 1 ? 0 : a.scores.indexOf(best) + 1;
}

function endArena(champ) {
  const a = arena; a.state = 'end';
  bump('duo'); store.save(); checkTrophies();
  sfx.win(); buzz([40, 60, 80]);
  for (let p = 1; p <= a.n; p++) {
    const z = zone(p), won = p === champ;
    const w = document.createElement('div'); w.className = 'win';
    w.innerHTML = `<div><b>${champ === 0 ? 'Égalité' : won ? 'Gagné' : 'Perdu'}</b><span>${champ === 0 ? 'Personne ne lâche rien.' : won ? `Bravo ${esc(a.names[p - 1])} !` : `${esc(a.names[champ - 1])} l’emporte.`}</span>
      <div class="endbar"><button class="btn ink" data-ax="again">Revanche</button><button class="btn line" data-ax="leave">Quitter</button></div></div>`;
    z.appendChild(w);
  }
  a.el.querySelector('.arena-x').hidden = true;
}

function leaveArena() {
  const a = arena; if (!a) return;
  clearArenaTimers(); arena = null;
  closeOverlay(a.el);
  render();
}
function arenaBack() { // bouton retour du téléphone
  const a = arena; if (!a) return;
  clearArenaTimers(); arena = null; a.el.remove(); document.body.style.overflow = ''; render();
}

async function quitArena() {
  const a = arena; if (!a) return;
  if (a.state === 'end') return leaveArena();
  const was = a.state; clearArenaTimers(); a.state = 'pause';
  const ok = await confirmSheet('Arrêter la partie ?', 'Le score de cette partie sera perdu.', 'Arrêter', 'Reprendre');
  if (!arena) return;
  if (ok) leaveArena();
  else if (was === 'count') { a.el.querySelector('.count3')?.remove(); countdown(); }
  else { a.state = 'play'; nextRound(); }
}

document.addEventListener('pointerdown', e => {
  if (!arena) return;
  const t = e.target.closest('.tile');
  if (!t || !arena.el.contains(t)) return;
  e.preventDefault();
  tap(+t.closest('.zone').dataset.p, +t.dataset.t);
});
document.addEventListener('click', e => {
  if (!arena) return;
  const b = e.target.closest('[data-ax]'); if (!b || !arena.el.contains(b)) return;
  const act = b.dataset.ax;
  if (act === 'quit') quitArena();
  if (act === 'leave') leaveArena();
  if (act === 'again') {
    const { mode, n, lv, pool, names } = arena;
    clearArenaTimers(); const el = arena.el; arena = null; el.remove();
    startArena({ mode, n, lv, pool, names });
  }
});
document.addEventListener('keydown', e => { if (arena && e.key === 'Escape') { e.preventDefault(); quitArena(); } });

// ---- main.js
/* Démarrage. */
store.load();
document.documentElement.dataset.level = store.d.level;
applyPrefs();
window.addEventListener('hashchange', () => { if (!session && !arena) { render(); window.scrollTo(0, 0); } });
render();
if (!store.d.onboarded) startOnboarding();
cloudFlush();
cloudSync();
if (canSpeak()) try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => {}; } catch (e) { /* voix chargées plus tard */ }
window.addEventListener('online', cloudFlush);
if (/[?&]debug\b/.test(location.search)) window.__mq = { FIG, DATA, store, startSession, startArena, questionsOf, choicesFor, duoPool, arena: () => arena, session: () => session, cloudSync, pupil };

})();
</script>
