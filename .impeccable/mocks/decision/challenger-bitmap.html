<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Work+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#F2F0EA;color:#0B0B0B;font-family:'Work Sans',sans-serif}
.h{font-family:Silkscreen;font-weight:700;font-size:64px;line-height:.9;padding:24px 16px 0;letter-spacing:-.02em}
.sub{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:2px solid #0B0B0B;font-family:Silkscreen;font-size:14px}
.spec{padding:8px 16px}
.lv{display:flex;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid #0B0B0B}
.lv b{font-family:Silkscreen;font-weight:700}
.lv span{font-size:13px}
.l1 b{font-size:56px;background:#3DF56B;padding:0 6px}.l2 b{font-size:40px}.l3 b{font-size:28px}.l4 b{font-size:20px}
.play{margin:20px 16px;background:#0B0B0B;color:#3DF56B;font-family:Silkscreen;font-size:24px;text-align:center;padding:18px}
.list{padding:0 16px;font-size:15px}
.list div{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dotted #0B0B0B;font-weight:500}
.list span{font-family:Silkscreen}
</style></head><body>
<div class="h">MATH<br>QUEST</div>
<div class="sub"><span>NIV 04</span><span>SERIE 12</span><span>XP 1240</span></div>
<div class="spec">
 <div class="lv l1"><b>6E</b><span>Cycle 3 · 8 chapitres</span></div>
 <div class="lv l2"><b>5E</b><span>Programme 2026</span></div>
 <div class="lv l3"><b>4E</b><span>Cycle 4</span></div>
 <div class="lv l4"><b>3E</b><span>Brevet</span></div>
</div>
<div class="play">&gt; JOUER_</div>
<div class="list">
 <div>Calcul mental &amp; tables<span>70%</span></div>
 <div>Entiers &amp; division<span>45%</span></div>
 <div>Nombres décimaux<span>20%</span></div>
 <div>Fractions<span>--</span></div>
</div>
</body></html>
