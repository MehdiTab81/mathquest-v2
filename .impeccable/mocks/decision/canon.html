<!doctype html><html lang="fr"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#fff;color:#1F2937;font-family:system-ui,sans-serif}
.top{display:flex;justify-content:space-between;padding:16px;font-weight:700}
.streak{background:#FFF4E5;color:#C2410C;border-radius:999px;padding:6px 12px;font-size:14px}
h1{font-size:28px;padding:8px 16px 4px}
.sub{padding:0 16px;color:#6B7280}
.tabs{display:flex;gap:8px;padding:16px}
.tabs b{padding:8px 16px;border-radius:999px;background:#F3F4F6;font-size:15px}
.tabs b.on{background:#6D4AFF;color:#fff}
.card{margin:0 16px 12px;border:1px solid #E5E7EB;border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center}
.card h3{font-size:17px}.card p{color:#6B7280;font-size:13px;margin-top:4px}
.ring{width:44px;height:44px;border-radius:50%;border:5px solid #22C55E}
.btn{position:absolute;left:16px;right:16px;bottom:24px;background:#6D4AFF;color:#fff;text-align:center;border-radius:14px;padding:16px;font-weight:700;font-size:17px}
</style></head><body>
<div class="top"><span>MathQuest</span><span class="streak">12 jours</span></div>
<h1>Bonjour !</h1><p class="sub">Continue ta série du jour.</p>
<div class="tabs"><b class="on">6e</b><b>5e</b><b>4e</b><b>3e</b></div>
<div class="card"><div><h3>Calcul mental &amp; tables</h3><p>255 questions</p></div><div class="ring"></div></div>
<div class="card"><div><h3>Entiers &amp; division</h3><p>83 questions</p></div><div class="ring"></div></div>
<div class="card"><div><h3>Nombres décimaux</h3><p>65 questions</p></div><div class="ring"></div></div>
<div class="card"><div><h3>Fractions</h3><p>56 questions</p></div><div class="ring"></div></div>
<div class="btn">Commencer</div>
</body></html>
