<!doctype html><html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:390px;height:844px;overflow:hidden;background:#1D2B6B;color:#fff;font-family:Nunito,sans-serif}
.bar{display:flex;gap:8px;padding:16px}
.pill{flex:1;background:#0F1846;border:3px solid #000;border-radius:14px;padding:6px 10px;font-family:'Lilita One';font-size:18px;text-shadow:0 2px 0 #000}
.title{font-family:'Lilita One';font-size:44px;text-align:center;color:#FFD43B;-webkit-text-stroke:2px #000;text-shadow:0 4px 0 #000;margin-top:8px}
.lv{display:flex;gap:8px;justify-content:center;margin-top:16px}
.lv b{font-family:'Lilita One';font-weight:400;font-size:20px;padding:8px 14px;border:3px solid #000;border-radius:14px;background:#3BA7FF;box-shadow:0 5px 0 #000}
.lv b.on{background:#FFD43B;color:#1D2B6B}
.play{margin:28px 32px 0;background:#FFD43B;color:#1D2B6B;border:4px solid #000;border-radius:22px;box-shadow:0 8px 0 #000;text-align:center;font-family:'Lilita One';font-size:40px;padding:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:32px 16px 0}
.card{background:#fff;color:#1D2B6B;border:3px solid #000;border-radius:18px;box-shadow:0 6px 0 #000;padding:14px;height:132px}
.card h3{font-family:'Lilita One';font-weight:400;font-size:20px;line-height:1.05}
.card p{font-weight:800;font-size:13px;margin-top:6px;color:#4A5590}
.prog{height:12px;border:2px solid #000;border-radius:8px;margin-top:22px;background:#E5E9FF;overflow:hidden}
.prog i{display:block;height:100%;background:#FF5A5F}
</style></head><body>
<div class="bar"><div class="pill">🏆 1 240</div><div class="pill">🔥 12</div><div class="pill">⭐ Niv 4</div></div>
<div class="title">MATHQUEST</div>
<div class="lv"><b class="on">6e</b><b>5e</b><b>4e</b><b>3e</b></div>
<div class="play">JOUER !</div>
<div class="grid">
 <div class="card"><h3>Calcul mental &amp; tables</h3><p>255 questions</p><div class="prog"><i style="width:70%"></i></div></div>
 <div class="card"><h3>Entiers &amp; division</h3><p>83 questions</p><div class="prog"><i style="width:45%"></i></div></div>
 <div class="card"><h3>Nombres décimaux</h3><p>65 questions</p><div class="prog"><i style="width:20%"></i></div></div>
 <div class="card"><h3>Fractions</h3><p>56 questions</p><div class="prog"><i style="width:0"></i></div></div>
</div>
</body></html>
