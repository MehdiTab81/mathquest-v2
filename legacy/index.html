@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(12px);
    filter: blur(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}
@keyframes popIn {
  0% {
    opacity: 0;
    transform: scale(0.6);
  }
  60% {
    opacity: 1;
    transform: scale(1.08);
  }
  100% {
    transform: scale(1);
  }
}
@keyframes pulse-glow {
  0%, 100% {
    box-shadow: 0 0 0 0 hsl(var(--primary) / 0.35);
  }
  50% {
    box-shadow: 0 0 22px 4px hsl(var(--primary) / 0.18);
  }
}
@keyframes shake {
  0%, 100% {
    transform: translateX(0);
  }
  20%, 60% {
    transform: translateX(-7px);
  }
  40%, 80% {
    transform: translateX(7px);
  }
}
@keyframes flash-good {
  0% {
    box-shadow: inset 0 0 0 0 hsl(var(--success) / 0);
  }
  30% {
    box-shadow: inset 0 0 0 9999px hsl(var(--success) / 0.18);
  }
  100% {
    box-shadow: inset 0 0 0 9999px hsl(var(--success) / 0);
  }
}
@keyframes drift {
  0% {
    transform: translate3d(0, 0, 0) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: var(--particle-opacity, 0.35);
  }
  90% {
    opacity: var(--particle-opacity, 0.35);
  }
  100% {
    transform: translate3d(var(--drift-x, 30px), -110vh, 0) rotate(240deg);
    opacity: 0;
  }
}
@keyframes countdown {
  0% {
    opacity: 0;
    transform: scale(2.2);
  }
  25% {
    opacity: 1;
    transform: scale(1);
  }
  80% {
    opacity: 1;
    transform: scale(0.95);
  }
  100% {
    opacity: 0;
    transform: scale(0.6);
  }
}
@keyframes float-y {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
.animate-fade-in {
  animation: fadeIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.animate-pop-in {
  animation: popIn 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
}
.animate-pulse-glow {
  animation: pulse-glow 2s ease-in-out infinite;
}
.animate-shake {
  animation: shake 0.4s ease;
}
.animate-flash-good {
  animation: flash-good 0.6s ease-out;
}
.animate-countdown {
  animation: countdown 0.95s ease-out both;
}
.animate-float {
  animation: float-y 3s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
